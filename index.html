<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ДВС — симулятор</title>
<link rel="icon" type="image/png" href="launchericon-192x192.png">
<link rel="apple-touch-icon" href="launchericon-192x192.png">
<link rel="shortcut icon" href="launchericon-96x96.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=1000008">
</head>
<body>
<header>Двигатель внутреннего сгорания</header>
<div class="eng-badge" id="engBadge">R4</div>
<button id="repairBtn" type="button">🔧</button>

<!-- ============ ВЕРХ: КАРУСЕЛЬ СТРАНИЦ ============ -->
<div class="pages-wrap">
  <div class="pages" id="pages">

    <!-- Страница 0: 2D-мотор -->
    <section class="page">
      <div class="panel" id="engineWrap2d">
        <canvas id="engineCv" width="640" height="430"></canvas>
      </div>
    </section>

    <!-- Страница 1: 3D-мотор -->
    <section class="page">
      <div class="panel" id="engineWrap">
        <canvas id="engine3dCv" width="640" height="430"></canvas>
        <button id="ghostBtn" type="button">👁 Скрыто</button>
        <button id="lockBtn" type="button">🔓</button>
      </div>
    </section>

    <!-- Страница 2: Manifold Pressure -->
    <section class="page">
      <div class="panel chart-panel">
        <div class="chart-title">MANIFOLD PRESSURE</div>
        <canvas id="manifoldCv"></canvas>
      </div>
    </section>

    <!-- Страница 3: Цилиндры -->
    <section class="page">
      <div class="panel chart-panel">
        <div class="chart-title">CYLINDERS</div>
        <canvas id="cylsCv"></canvas>
      </div>
    </section>

    <!-- Страница 4: Torque / Power -->
    <section class="page">
      <div class="panel chart-panel">
        <div class="chart-title">TORQUE / POWER</div>
        <canvas id="torqueCv"></canvas>
      </div>
    </section>

    <!-- Страница 5: Flow -->
    <section class="page">
      <div class="panel chart-panel">
        <div class="chart-title">EXHAUST / INTAKE FLOW</div>
        <canvas id="flowCv"></canvas>
      </div>
    </section>

  </div>
  <div class="dots" id="dots">
    <span class="dot on"></span><span class="dot"></span><span class="dot"></span>
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
</div>

<!-- ============ НИЗ: ПРИБОРКА + ПЕРЕДАЧИ + ПУСК ============ -->
<div class="panel" id="dash">
  <canvas id="gaugeCv" width="340" height="190"></canvas>
  <div class="gears-box" id="gearsManual">
    <svg class="gb-lines" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="12.5" y1="25" x2="12.5" y2="50" vector-effect="non-scaling-stroke"/>
      <line x1="37.5" y1="25" x2="37.5" y2="75" vector-effect="non-scaling-stroke"/>
      <line x1="62.5" y1="25" x2="62.5" y2="75" vector-effect="non-scaling-stroke"/>
      <line x1="87.5" y1="25" x2="87.5" y2="75" vector-effect="non-scaling-stroke"/>
      <line x1="12.5" y1="50" x2="87.5" y2="50" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="gb-grid">
      <button class="gbtn gb-r" data-g="-1" type="button">R</button>
      <button class="gbtn" data-g="1" type="button">1</button>
      <button class="gbtn" data-g="3" type="button">3</button>
      <button class="gbtn" data-g="5" type="button">5</button>
      <button class="gbtn neu gb-n" data-g="0" type="button">N</button>
      <button class="gbtn" data-g="2" type="button">2</button>
      <button class="gbtn" data-g="4" type="button">4</button>
      <button class="gbtn" data-g="6" type="button">6</button>
    </div>
  </div>
  <div class="gears-auto" id="gearsAuto">
    <button class="agbtn rev" data-ag="-1" type="button">R</button>
    <button class="agbtn neu" data-ag="0" type="button">N</button>
    <button class="agbtn on" data-ag="1" type="button">D</button>
  </div>
  <button class="ignbtn" id="ignBtn" type="button">ЗАЖИГАНИЕ</button>
</div>

<!-- ============ ПЕДАЛИ ============ -->
<div class="pedals">
  <div class="pedal clutch" id="pClutch" data-pedal="clutch"><div class="bar"></div><span class="icon">🦶</span><span>СЦЕПЛЕНИЕ</span><span class="sub">держать</span></div>
  <div class="pedal brake" id="pBrake" data-pedal="brake"><div class="bar"></div><span class="icon">🛑</span><span>ТОРМОЗ</span><span class="sub">держать</span></div>
  <div class="pedal" id="pGas" data-pedal="gas"><div class="bar"></div><span class="icon">⛽</span><span>ГАЗ</span><span class="sub">держать</span></div>
</div>

<div id="breakBanner"></div>
<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="physics.js?v=1000008" defer></script>
<script src="render-base.js?v=1000008" defer></script>
<script src="re-1.js?v=1000008" defer></script>
<script src="re-2.js?v=1000008" defer></script>
<script src="re-3.js?v=1000008" defer></script>
<script src="re-4.js?v=1000008" defer></script>
<script src="re-5.js?v=1000008" defer></script>
<script src="re-6.js?v=1000008" defer></script>
<script src="re-7.js?v=1000008" defer></script>
<script src="render.js?v=1000008" defer></script>
<script src="engine.js?v=1000008" defer></script>
<script src="sound.js?v=1000008" defer></script>
<script src="menu.js?v=1000008" defer></script>
<script src="settings.js?v=1000008" defer></script>
<script src="view3d.js?v=1000008" defer></script>
<script src="view3d-build.js?v=1000008" defer></script>
<script src="view3d-wankel.js?v=1000008" defer></script>
<script src="view3d-dci.js?v=1000008" defer></script>
<script src="pages.js?v=1000008" defer></script>
<script src="timer.js?v=1000008" defer></script>
<script src="maint.js?v=1000008" defer></script>

<script>
/* ==================== ЖИВАЯ ДИАГНОСТИКА 3D ==================== */
(function(){
  var box=document.createElement('div');
  box.style.cssText='position:fixed;top:70px;left:8px;right:8px;z-index:999999;'+
    'background:#000;color:#0f0;font:11px/1.4 monospace;padding:10px;'+
    'border:2px solid #0f0;white-space:pre-wrap;border-radius:8px;'+
    'box-shadow:0 0 30px rgba(0,255,0,.5)';

  var txt=document.createElement('div');
  box.appendChild(txt);

  var btn=document.createElement('div');
  btn.textContent='▶ ОТКРЫТЬ 3D СЕЙЧАС';
  btn.style.cssText='margin-top:8px;padding:10px;background:#0f0;color:#000;'+
    'text-align:center;font-weight:700;border-radius:6px;cursor:pointer;font-size:13px';
  btn.onclick=function(){
    if(window.DVS_3D && window.DVS_3D.show3D){
      try{window.DVS_3D.show3D();}catch(e){ txt.textContent='ОШИБКА show3D: '+e.message; return; }
    }
    var pg=document.getElementById('pages');
    if(pg)pg.scrollTo({left:pg.clientWidth,behavior:'smooth'});
  };
  box.appendChild(btn);

  var close=document.createElement('div');
  close.textContent='✕ закрыть диагностику';
  close.style.cssText='margin-top:6px;padding:6px;background:rgba(255,80,80,.3);color:#fff;'+
    'text-align:center;border-radius:6px;cursor:pointer;font-size:11px';
  close.onclick=function(){ box.remove(); };
  box.appendChild(close);

  document.body.appendChild(box);

  function update(){
    var msg=[];
    msg.push('THREE: '+(window.THREE?'OK':'НЕТ'));
    msg.push('DVS_3D: '+(window.DVS_3D?'OK':'НЕТ'));
    msg.push('show3D: '+(window.DVS_3D&&typeof window.DVS_3D.show3D==='function'?'OK':'НЕТ'));
    msg.push('DVS_3D_REF: '+(window.DVS_3D_REF?'OK':'НЕТ'));
    msg.push('DVS_3D_BUILD: '+(window.DVS_3D_BUILD?'OK':'НЕТ'));
    msg.push('REBUILD: '+(window.DVS_3D_REBUILD?'OK':'НЕТ'));
    msg.push('fallback: '+(window._dvsFallbackRebuild?'ДА':'НЕТ'));
    msg.push('active: '+(window.DVS_3D&&window.DVS_3D.isActive?window.DVS_3D.isActive():'?'));
    var cv=document.getElementById('engine3dCv');
    msg.push('canvas: '+(cv?cv.clientWidth+'x'+cv.clientHeight:'НЕТ'));
    var wrap=document.getElementById('engineWrap');
    msg.push('wrap: '+(wrap?wrap.clientWidth+'x'+wrap.clientHeight:'НЕТ'));
    var pg=document.getElementById('pages');
    if(pg){
      var idx=Math.round(pg.scrollLeft/pg.clientWidth);
      msg.push('page: '+idx);
    }
    if(window.DVS_3D_REF){
      var sc=window.DVS_3D_REF.getScene();
      msg.push('scene: '+(sc?'OK':'НЕТ'));
      if(sc)msg.push('дети: '+sc.children.length);
    }
    msg.push('engineType: '+(window.S?window.S.engineType:'?'));
    txt.textContent=msg.join('\n');
  }
  update();
  setInterval(update,1200);
})();

/* ==================== SERVICE WORKER ==================== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){r.unregister();});}).catch(function(){});
  window.addEventListener('load', function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.log('SW:',e);});});
}
</script>
</body>
</html>
