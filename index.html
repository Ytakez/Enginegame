<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ДВС — симулятор</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{height:100dvh;overflow:hidden;display:flex;flex-direction:column;
 background:radial-gradient(ellipse at 50% -10%,#1e2a38 0%,#0a0e13 65%);color:#dbe4ee;
 font-family:'Segoe UI',system-ui,sans-serif;-webkit-user-select:none;user-select:none;
 -webkit-tap-highlight-color:transparent;touch-action:manipulation}
header{padding:6px;text-align:center;font-size:11px;letter-spacing:3px;
 text-transform:uppercase;color:#6d7f96;font-weight:600}
main{flex:1 1 0;min-height:0;display:flex;gap:8px;padding:6px 8px}
.panel{background:linear-gradient(180deg,#151d27,#0d131a);border:1px solid #22303f;
 border-radius:12px;padding:6px;box-shadow:0 10px 26px rgba(0,0,0,.5)}
#engineWrap{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#engineCv{display:block;max-width:100%;max-height:100%}
#dash{flex:0 0 auto;width:min(42%,340px);display:flex;flex-direction:column;gap:6px}
#gaugeCv{display:block;width:100%;height:auto}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.ro{background:#0b1119;border:1px solid #1d2836;border-radius:8px;padding:4px;text-align:center}
.ro .lbl{font-size:8px;letter-spacing:1.4px;color:#5d7189;text-transform:uppercase}
.ro .val{font-size:17px;font-weight:700;color:#9fe8c0;line-height:1.1}
.ro .val.amber{color:#ffc93c}
.gears{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;
 background:#0d1319;border:1px solid #2a3a4c;border-radius:10px;padding:6px}
.gbtn{height:38px;border-radius:8px;border:1px solid #2c3e52;
 background:linear-gradient(180deg,#1a2430,#0e161e);color:#8ea4bd;
 font:700 15px/1 inherit;cursor:pointer;touch-action:manipulation}
.gbtn.on{background:linear-gradient(180deg,#2b7a56,#1c5a3d);border-color:#43c98a;color:#e6fff3;
 box-shadow:0 0 12px rgba(67,201,138,.5)}
.gbtn.neu.on{background:linear-gradient(180deg,#5a5f2b,#3d421c);border-color:#c9c943;color:#fbffe6}
.gbtn.rev.on{background:linear-gradient(180deg,#7a2b2b,#4a1a1a);border-color:#ff5b5b;color:#ffe6e6}
.gN{grid-column:2;grid-row:2}
.ignbtn{width:100%;height:42px;border-radius:10px;border:1px solid #2c4a63;
 background:linear-gradient(180deg,#1d2f3f,#101a23);color:#8fd8ff;
 font:800 12px/1 inherit;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer}
.ignbtn.on{background:linear-gradient(180deg,#2b7a56,#1c5a3d);border-color:#43c98a;color:#e6fff3}
.pedals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px;
 padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.pedal{position:relative;height:105px;border-radius:16px;border:1px solid #263547;
 background:linear-gradient(180deg,#1a2430,#0f161e);color:#a9bdd4;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
 font:800 12px/1 inherit;letter-spacing:1.2px;overflow:hidden;touch-action:none}
.pedal .bar{position:absolute;left:0;bottom:0;height:100%;width:0%;
 background:linear-gradient(90deg,rgba(67,201,138,.4),rgba(67,201,138,.06));
 pointer-events:none;transition:width .04s linear}
.pedal.brake .bar{background:linear-gradient(90deg,rgba(255,80,80,.4),rgba(255,80,80,.06))}
.pedal.clutch .bar{background:linear-gradient(90deg,rgba(255,200,60,.38),rgba(255,200,60,.05))}
.pedal .icon{font-size:24px;line-height:1}
.pedal .sub{font-size:9px;color:#5d7189;font-weight:600}
.pedal.active{border-color:#43c98a;color:#eafff5;box-shadow:0 0 22px rgba(67,201,138,.4)}
.pedal.brake.active{border-color:#ff5b5b;box-shadow:0 0 22px rgba(255,91,91,.4);color:#ffecec}
.pedal.clutch.active{border-color:#ffc93c;box-shadow:0 0 22px rgba(255,201,60,.4);color:#fff8e0}
@media (orientation:portrait) and (max-width:820px){
 main{flex-direction:column;gap:6px}
 #engineWrap{flex:0 0 auto;height:34vh;min-height:170px}
 #dash{width:auto;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:6px}
 #gaugeCv{width:min(40%,150px)}
 .readouts{flex:1 1 130px;min-width:120px}
 .gears{flex:1 1 100%}
 .ignbtn{flex:1 1 100%}
 .pedal{height:90px}
}
#err{position:fixed;left:0;right:0;bottom:0;background:#a00;color:#fff;
 font:12px/1.4 monospace;padding:8px;z-index:9999;display:none;white-space:pre-wrap}
#repairBtn{position:fixed;top:8px;left:8px;z-index:1001;width:44px;height:44px;
 border-radius:50%;border:2px solid #ff5b5b;background:linear-gradient(180deg,#8a0a0a,#5a0505);
 color:#fff;font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center}
body.broken #repairBtn{display:flex}
#breakBanner{position:fixed;top:0;left:0;right:0;z-index:999;
 background:linear-gradient(180deg,#c11,#8a0a0a);color:#fff;text-align:center;
 font-weight:700;padding:10px;font-size:13px;display:none}
body.broken #breakBanner{display:block}
</style>
</head>
<body>

<header>Двигатель внутреннего сгорания</header>
<button id="repairBtn" type="button">🔧</button>

<main>
  <div class="panel" id="engineWrap">
    <canvas id="engineCv" width="640" height="430"></canvas>
  </div>
  <div class="panel" id="dash">
    <canvas id="gaugeCv" width="290" height="185"></canvas>
    <div class="readouts">
      <div class="ro"><div class="lbl">Скорость</div><div class="val" id="spdVal">0</div></div>
      <div class="ro"><div class="lbl">Передача</div><div class="val amber" id="gearVal">N</div></div>
    </div>
    <div class="gears">
      <button class="gbtn" data-g="1" type="button">1</button>
      <button class="gbtn" data-g="3" type="button">3</button>
      <button class="gbtn" data-g="5" type="button">5</button>
      <button class="gbtn" data-g="2" type="button">2</button>
      <button class="gbtn neu on gN" data-g="0" type="button">N</button>
      <button class="gbtn" data-g="4" type="button">4</button>
      <button class="gbtn rev" data-g="-1" type="button">R</button>
    </div>
    <button class="ignbtn on" id="ignBtn" type="button">Зажигание</button>
  </div>
</main>

<div class="pedals">
  <div class="pedal clutch" id="pClutch" data-pedal="clutch">
    <div class="bar"></div><span class="icon">🦶</span>
    <span>СЦЕПЛЕНИЕ</span><span class="sub">держать</span>
  </div>
  <div class="pedal brake" id="pBrake" data-pedal="brake">
    <div class="bar"></div><span class="icon">🛑</span>
    <span>ТОРМОЗ</span><span class="sub">держать</span>
  </div>
  <div class="pedal" id="pGas" data-pedal="gas">
    <div class="bar"></div><span class="icon">⛽</span>
    <span>ГАЗ</span><span class="sub">держать</span>
  </div>
</div>

<div id="breakBanner"></div>
<div id="err"></div>

<script>
(function(){
"use strict";

var errBox = document.getElementById('err');
function showErr(m){ if(errBox){errBox.style.display='block';errBox.textContent='Ошибка: '+m;} }
window.addEventListener('error',function(ev){
  if (!ev.filename || ev.filename.indexOf('github.io')===-1) return;
  showErr(ev.message+' | '+(ev.filename||'')+':'+(ev.lineno||0));
});

var S = {
  rpm:0,speed:0,gear:0,crankAngle:0,
  running:false,stalled:false,broken:false,
  throttle:0,brakePedal:0,clutchPedal:0,
  pressed:{gas:false,brake:false,clutch:false}
};

var gearRatios=[0,3.40,2.00,1.35,1.00,0.78];
var reverseRatio=-3.17;
var finalDrive=3.90,wheelRadius=0.31,mass=1250;
var Iwheel=mass*wheelRadius*wheelRadius;
var Iengine=0.55,maxTorque=250,clutchK=40,clutchMax=350;
var idleRpm=900,stallRpm=350,redlineRpm=6800,breakRpm=8000;

function torqueCurve(r){
  var x=Math.max(800,Math.min(6500,r));
  return 0.55+0.45*Math.sin(Math.PI*(x-800)/(6500-800));
}

function breakEngine(reason){
  if (S.broken) return;
  S.broken=true;S.running=false;S.stalled=true;S.rpm=0;
  document.body.classList.add('broken');
  var b=document.getElementById('breakBanner');
  if(b) b.textContent='⚠ ДВИГАТЕЛЬ СЛОМАН: '+(reason||'поломка');
  var ig=document.getElementById('ignBtn');
  if(ig) ig.classList.remove('on');
  try{if(navigator.vibrate)navigator.vibrate([100,60,100,60,200]);}catch(e){}
}

function repair(){
  S.broken=false;S.stalled=false;S.running=false;S.rpm=0;S.speed=0;S.gear=0;
  document.body.classList.remove('broken');
  var gb=document.querySelectorAll('.gbtn');
  for(var i=0;i<gb.length;i++) gb[i].classList.toggle('on',Number(gb[i].dataset.g)===0);
  var gv=document.getElementById('gearVal');
  if(gv) gv.textContent='N';
  var ig=document.getElementById('ignBtn');
  if(ig) ig.classList.remove('on');
  S.pressed.gas=false;S.pressed.brake=false;S.pressed.clutch=false;
  try{if(navigator.vibrate)navigator.vibrate(15);}catch(e){}
}

function physics(dt){
  if(S.broken){
    S.rpm=0;
    S.speed*=Math.max(0,1-2.5*dt);
    if(Math.abs(S.speed)<0.1)S.speed=0;
    return;
  }
  var ratio;
  if(S.gear===0)ratio=0;
  else if(S.gear===-1)ratio=reverseRatio*finalDrive;
  else ratio=gearRatios[S.gear]*finalDrive;

  var eng=(S.gear===0||S.stalled||!S.running)?0:(1-S.clutchPedal);
  var omegaWheel=S.speed/3.6/wheelRadius;
  var omegaDirect=omegaWheel*ratio;
  var omegaEngine=S.rpm*Math.PI/30;
  var Te=0;
  if(S.running&&!S.stalled){
    var thr=S.throttle;
    if(S.rpm>redlineRpm)thr=0;
    Te=thr*maxTorque*torqueCurve(S.rpm);
    Te-=10+S.rpm*0.006;
    if(S.rpm<idleRpm)Te+=(idleRpm-S.rpm)*0.35;
  }
  var slip=omegaEngine-omegaDirect;
  var Tc=eng*clutchK*slip;
  Tc=Math.max(-clutchMax,Math.min(clutchMax,Tc));
  if(eng<0.001)Tc=0;
  var dE=(Te-Tc)/Iengine;
  var v=Math.abs(S.speed)/3.6;
  var dragF=0.42*v*v+150;
  var dragT=dragF*wheelRadius*(omegaWheel>=0?1:-1);
  var brakeT=S.brakePedal*2600*(omegaWheel>=0?1:-1);
  var wheelTorque=Tc*ratio-brakeT-dragT;
  var dW=wheelTorque/Iwheel;
  var nE=omegaEngine+dE*dt;
  var nW=omegaWheel+dW*dt;
  if(nE<0)nE=0;
  S.rpm=nE*30/Math.PI;
  S.speed=nW*wheelRadius*3.6;

  if(S.rpm>breakRpm){breakEngine('перекрут '+Math.round(S.rpm)+' об/мин');return;}
  if(Math.abs(S.speed)<0.12&&(S.brakePedal>0.05||S.gear===0)){if(Math.abs(nW)<0.6)S.speed=0;}
  if(!S.stalled&&S.running&&S.rpm<stallRpm&&(eng>0.25||S.rpm<120)){
    S.stalled=true;S.running=false;S.rpm=0;
  }
  if(S.stalled)S.rpm=Math.max(0,S.rpm-2600*dt);
  S.crankAngle+=(S.rpm*Math.PI/30)*dt*0.55;
  var TAU=Math.PI*4;
  S.crankAngle=((S.crankAngle%TAU)+TAU)%TAU;
}

/* ПЕДАЛИ */
var pedalEls={clutch:document.getElementById('pClutch'),brake:document.getElementById('pBrake'),gas:document.getElementById('pGas')};
var activeTouches={};

function pedalPress(n){
  if(S.pressed[n])return;
  S.pressed[n]=true;
  if(pedalEls[n])pedalEls[n].classList.add('active');
  try{if(navigator.vibrate)navigator.vibrate(8);}catch(e){}
}
function pedalRelease(n){
  if(!S.pressed[n])return;
  S.pressed[n]=false;
  if(pedalEls[n])pedalEls[n].classList.remove('active');
}
function pedalReleaseAll(){
  pedalRelease('gas');pedalRelease('brake');pedalRelease('clutch');
  activeTouches={};
}

function onTouchStart(e){
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    var el=document.elementFromPoint(t.clientX,t.clientY);
    if(!el)continue;
    var pedal=el.closest?el.closest('.pedal'):null;
    if(pedal){
      e.preventDefault();
      var n=pedal.dataset.pedal;
      activeTouches[t.identifier]=n;
      pedalPress(n);
    }
  }
}
function onTouchEnd(e){
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    var n=activeTouches[t.identifier];
    if(n){
      delete activeTouches[t.identifier];
      var still=false;
      for(var k in activeTouches){if(activeTouches[k]===n)still=true;}
      if(!still)pedalRelease(n);
    }
  }
}
document.addEventListener('touchstart',onTouchStart,{passive:false});
document.addEventListener('touchend',onTouchEnd,{passive:false});
document.addEventListener('touchcancel',onTouchEnd,{passive:false});

Object.keys(pedalEls).forEach(function(n){
  var el=pedalEls[n];
  if(!el)return;
  el.addEventListener('mousedown',function(e){e.preventDefault();pedalPress(n);});
  el.addEventListener('mouseup',function(){pedalRelease(n);});
  el.addEventListener('mouseleave',function(){pedalRelease(n);});
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
});

window.addEventListener('blur',pedalReleaseAll);
document.addEventListener('visibilitychange',function(){if(document.hidden)pedalReleaseAll();});

/* ПЕРЕДАЧИ */
var gearBtns=Array.prototype.slice.call(document.querySelectorAll('.gbtn'));
function setGear(g){
  if(S.broken)return;
  if(g===S.gear)return;
  S.gear=g;
  gearBtns.forEach(function(b){b.classList.toggle('on',Number(b.dataset.g)===g);});
  var gv=document.getElementById('gearVal');
  if(gv) gv.textContent=(g===0?'N':(g===-1?'R':String(g)));
  try{if(navigator.vibrate)navigator.vibrate(6);}catch(e){}
}
gearBtns.forEach(function(b){
  b.addEventListener('click',function(e){e.preventDefault();setGear(Number(b.dataset.g));});
});

/* ЗАЖИГАНИЕ */
var ignBtn=document.getElementById('ignBtn');
var ignLock=false;
function toggleIgnition(){
  if(S.broken){
    try{if(navigator.vibrate)navigator.vibrate([50,50,50]);}catch(e){}
    return;
  }
  if(S.running&&!S.stalled){
    S.running=false;S.stalled=true;ignBtn.classList.remove('on');
  }else{
    S.stalled=false;S.running=true;S.rpm=idleRpm;ignBtn.classList.add('on');
  }
  try{if(navigator.vibrate)navigator.vibrate(12);}catch(e){}
}
if(ignBtn) ignBtn.addEventListener('click',function(e){
  e.preventDefault();
  if(ignLock)return;
  ignLock=true;
  toggleIgnition();
  setTimeout(function(){ignLock=false;},350);
});

var repairBtn=document.getElementById('repairBtn');
if(repairBtn) repairBtn.addEventListener('click',function(e){e.preventDefault();repair();});

/* РЕНДЕР */
var ecv=document.getElementById('engineCv');
var ectx=ecv.getContext('2d');
var gcv=document.getElementById('gaugeCv');
var gctx=gcv.getContext('2d');
var spdEl=document.getElementById('spdVal');

var crankY=290,CR=33,ROD=98;
var cylCenters=[110,250,390,530];
var cylHalfW=46,cylTopY=120,cylBotY=272;
var offsets=[2*Math.PI,3*Math.PI,Math.PI,0];
var MAXR=8000;

function rr(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}

function drawValve(c,x,by,lift,color){
  c.fillStyle='#3a4756';c.fillRect(x-3,by-46,6,34);
  var y=by+lift;
  c.fillStyle=color;
  c.beginPath();
  c.moveTo(x-7.5,y-4);c.lineTo(x+7.5,y-4);c.lineTo(x+3.5,y+8);c.lineTo(x-3.5,y+8);
  c.closePath();c.fill();
  c.fillStyle='#2a3543';c.fillRect(x-8,by-50,16,6);
}

function drawEngine(){
  var c=ectx,W=ecv.width,H=ecv.height;
  c.clearRect(0,0,W,H);
  var bg=c.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0e151d');bg.addColorStop(1,'#070a0e');
  c.fillStyle=bg;c.fillRect(0,0,W,H);

  var isBroken=S.broken;
  var bg1=c.createLinearGradient(0,70,0,395);
  if(isBroken){bg1.addColorStop(0,'#3a2a2a');bg1.addColorStop(.5,'#2a1e1e');bg1.addColorStop(1,'#1a1212');}
  else{bg1.addColorStop(0,'#2b3746');bg1.addColorStop(.5,'#1d2733');bg1.addColorStop(1,'#131b24');}
  c.fillStyle=bg1;rr(c,40,72,560,320,12);c.fill();
  c.strokeStyle=isBroken?'#6a3a3a':'#3a4a5c';c.lineWidth=2;c.stroke();

  var hg=c.createLinearGradient(0,60,0,120);
  hg.addColorStop(0,isBroken?'#4a3030':'#334252');
  hg.addColorStop(1,isBroken?'#2a1c1c':'#212b37');
  c.fillStyle=hg;rr(c,40,58,560,62,10);c.fill();
  c.strokeStyle=isBroken?'#7a3a3a':'#42556b';c.lineWidth=2;c.stroke();

  c.fillStyle=isBroken?'#1a1010':'#121a22';
  rr(c,55,392,530,32,8);c.fill();
  c.strokeStyle=isBroken?'#3a2020':'#2a3a4b';c.lineWidth=1.5;c.stroke();

  var firing=S.running&&!S.stalled&&!isBroken;
  var throttle=S.throttle,crankAngle=S.crankAngle;

  c.fillStyle='rgba(0,0,0,0.4)';c.fillRect(60,crankY-15,520,30);
  var sg=c.createLinearGradient(0,crankY-12,0,crankY+12);
  if(isBroken){sg.addColorStop(0,'#3a2a2a');sg.addColorStop(.35,'#7a5a5a');sg.addColorStop(.55,'#5a4040');sg.addColorStop(1,'#2a1a1a');}
  else{sg.addColorStop(0,'#3d4a58');sg.addColorStop(.35,'#9aa8b8');sg.addColorStop(.55,'#7a8796');sg.addColorStop(1,'#232e3b');}
  c.fillStyle=sg;c.fillRect(60,crankY-11,520,22);
  c.strokeStyle='#0e151d';c.lineWidth=2;c.strokeRect(60,crankY-11,520,22);

  var mc=[72,180,320,460,588];
  for(var mi=0;mi<mc.length;mi++){
    var mx=mc[mi];
    var mg=c.createRadialGradient(mx-4,crankY-4,2,mx,crankY,16);
    if(isBroken){mg.addColorStop(0,'#8a6a6a');mg.addColorStop(.6,'#5a4040');mg.addColorStop(1,'#2a1a1a');}
    else{mg.addColorStop(0,'#b8c6d4');mg.addColorStop(.6,'#6d7a89');mg.addColorStop(1,'#3a4756');}
    c.fillStyle=mg;c.beginPath();c.arc(mx,crankY,15,0,7);c.fill();
    c.strokeStyle='#1a232e';c.lineWidth=2;c.stroke();
    c.fillStyle='#2a3543';c.beginPath();c.arc(mx,crankY,5,0,7);c.fill();
  }

  for(var i=0;i<4;i++){
    var cx=cylCenters[i];
    var cyc=crankAngle+offsets[i];
    var cycPos=((cyc%(Math.PI*4))+Math.PI*4)%(Math.PI*4);
    var stroke=Math.floor(cycPos/Math.PI);
    var s=Math.sin(cyc),co=Math.cos(cyc);
    var dist=CR*co+Math.sqrt(ROD*ROD-CR*CR*s*s);
    var pinY=crankY-dist;
    var pinX=cx+(isBroken?(i%2===0?7:-7):0);
    var cpX=cx+CR*s,cpY=crankY-CR*co;

    var bgr=c.createLinearGradient(cx-cylHalfW,0,cx+cylHalfW,0);
    bgr.addColorStop(0,'#070b10');
    bgr.addColorStop(.5,isBroken?'#1a0e0e':'#0e141c');
    bgr.addColorStop(1,'#070b10');
    c.fillStyle=bgr;
    c.fillRect(cx-cylHalfW,cylTopY,cylHalfW*2,cylBotY-cylTopY);
    c.strokeStyle=isBroken?'#5a3030':'#38495c';c.lineWidth=2;
    c.strokeRect(cx-cylHalfW,cylTopY,cylHalfW*2,cylBotY-cylTopY);

    var pTop=pinY-32;

    if(firing){
      var d=cycPos-2*Math.PI;
      var inten=Math.max(0,1-Math.abs(d)/1.25)*(0.35+0.65*throttle);
      if(inten>0.01){
        var gg=c.createRadialGradient(cx,cylTopY+26,2,cx,cylTopY+26,74);
        gg.addColorStop(0,'rgba(255,255,220,'+(0.95*inten)+')');
        gg.addColorStop(0.3,'rgba(255,175,50,'+(0.85*inten)+')');
        gg.addColorStop(0.65,'rgba(255,80,20,'+(0.45*inten)+')');
