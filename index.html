<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ДВС — симулятор</title>
<link rel="icon" type="image/png" href="launchericon-192x192.png">
<link rel="apple-touch-icon" href="launchericon-192x192.png">
<link rel="shortcut icon" href="launchericon-96x96.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=70000">
<style>
.gears-auto{display:none;gap:6px;background:#0d1319;border:1px solid #2a3a4c;border-radius:10px;padding:6px}
body.auto-mode .gears-auto{display:grid;grid-template-columns:repeat(3,1fr)}
body.auto-mode #gearsManual{display:none}
.agbtn{height:44px;border-radius:8px;border:1px solid #2c3e52;background:linear-gradient(180deg,#1a2430,#0e161e);color:#8ea4bd;font:700 16px/1 inherit;cursor:pointer;touch-action:manipulation}
.agbtn.on{background:linear-gradient(180deg,#2b7a56,#1c5a3d);border-color:#43c98a;color:#e6fff3}
.agbtn.neu.on{background:linear-gradient(180deg,#5a5f2b,#3d421c);border-color:#c9c943;color:#fbffe6}
.agbtn.rev.on{background:linear-gradient(180deg,#7a2b2b,#4a1a1a);border-color:#ff5b5b;color:#ffe6e6}
#gaugeCv{display:block;width:100%;height:auto;border-radius:10px}
.gears-box{position:relative;width:100%;height:150px;background:radial-gradient(ellipse at 50% 50%,#1a2430 0%,#0d1319 100%);border:1px solid #2a3a4c;border-radius:12px;padding:4px;overflow:hidden;flex:0 0 auto}
.gb-lines{position:absolute;top:4px;left:4px;width:calc(100% - 8px);height:calc(100% - 8px);pointer-events:none}
.gb-lines line{stroke:#2a3a4c;stroke-width:2.5;stroke-linecap:round}
.gb-grid{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;grid-template-areas:"r g1 g3 g5"". n  n  . "". g2 g4 g6";gap:2px;width:100%;height:100%;z-index:1}
.gb-grid .gbtn{width:34px;height:34px;border-radius:50%;border:2px solid #3a4a5c;background:linear-gradient(180deg,#1a2430,#0e161e);color:#c8d4e0;font:800 13px/1 inherit;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;align-self:center;justify-self:center;padding:0;margin:0;transition:background .1s,border-color .1s,box-shadow .1s,color .1s}
.gb-grid .gbtn.on{background:#f0f0f0;border-color:#fff;color:#000;box-shadow:0 0 14px rgba(255,255,255,.75);transform:scale(1.08)}
.gb-grid .gbtn.gb-n.on{background:#c9c943;border-color:#fff;color:#000;box-shadow:0 0 14px rgba(201,201,67,.75)}
.gb-grid .gbtn.gb-r{border-color:#6a3030;color:#ff9090}
.gb-grid .gbtn.gb-r.on{background:#c11;border-color:#ff5b5b;color:#fff;box-shadow:0 0 14px rgba(255,91,91,.85)}
.gb-r{grid-area:r}.gb-n{grid-area:n}
.gbtn[data-g="1"]{grid-area:g1}.gbtn[data-g="2"]{grid-area:g2}
.gbtn[data-g="3"]{grid-area:g3}.gbtn[data-g="4"]{grid-area:g4}
.gbtn[data-g="5"]{grid-area:g5}.gbtn[data-g="6"]{grid-area:g6}
.ignbtn{width:100%;height:40px;border-radius:10px;border:1px solid #2c4a63;background:linear-gradient(180deg,#1d2f3f,#101a23);color:#8fd8ff;font:800 12px/1 inherit;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;touch-action:manipulation}
.ignbtn.on{background:linear-gradient(180deg,#2b7a56,#1c5a3d);border-color:#43c98a;color:#e6fff3}
#ignBtn.start{background:linear-gradient(180deg,#c98a2b,#7a5a1a);border-color:#ffc93c;color:#fff;font-weight:900;letter-spacing:3px;box-shadow:0 0 20px rgba(255,201,60,.5)}
</style>
</head>
<body>
<header>Двигатель внутреннего сгорания</header>
<div class="eng-badge" id="engBadge">R4</div>
<button id="repairBtn" type="button">🔧</button>
<main>
<div class="panel" id="engineWrap"><canvas id="engineCv" width="640" height="430"></canvas></div>
<div class="panel" id="dash">
<canvas id="gaugeCv" width="340" height="190"></canvas>
<div class="gears-box" id="gearsManual">
  <svg class="gb-lines" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="12.5" y1="25" x2="12.5" y2="50" vector-effect="non-scaling-stroke"/>
    <line x1="37.5" y1="25" x2="37.5" y2="75" vector-effect="non-scaling-stroke"/>
    <line x1="62.5" y1="25" x2="62.5" y2="75" vector-effect="non-scaling-stroke"/>
    <line x1="87.5" y1="25" x2="87.5" y2="75" vector-effect="non-scaling-stroke"/>
    <line x1="12.5" y1="50" x2="87.5" y2="50" vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="gb-grid">
    <button class="gbtn gb-r" data-g="-1" type="button">R</button>
    <button class="gbtn" data-g="1" type="button">1</button>
    <button class="gbtn" data-g="3" type="button">3</button>
    <button class="gbtn" data-g="5" type="button">5</button>
    <button class="gbtn neu gb-n" data-g="0" type="button">N</button>
    <button class="gbtn" data-g="2" type="button">2</button>
    <button class="gbtn" data-g="4" type="button">4</button>
    <button class="gbtn" data-g="6" type="button">6</button>
  </div>
</div>
<div class="gears-auto" id="gearsAuto">
<button class="agbtn rev" data-ag="-1" type="button">R</button>
<button class="agbtn neu" data-ag="0" type="button">N</button>
<button class="agbtn on" data-ag="1" type="button">D</button>
</div>
<button class="ignbtn" id="ignBtn" type="button">ЗАЖИГАНИЕ</button>
</div>
</main>
<div class="pedals">
<div class="pedal clutch" id="pClutch" data-pedal="clutch"><div class="bar"></div><span class="icon">🦶</span><span>СЦЕПЛЕНИЕ</span><span class="sub">держать</span></div>
<div class="pedal brake" id="pBrake" data-pedal="brake"><div class="bar"></div><span class="icon">🛑</span><span>ТОРМОЗ</span><span class="sub">держать</span></div>
<div class="pedal" id="pGas" data-pedal="gas"><div class="bar"></div><span class="icon">⛽</span><span>ГАЗ</span><span class="sub">держать</span></div>
</div>
<div id="breakBanner"></div>
<div id="err"></div>
<script src="physics.js?v=70000" defer></script>
<script src="render-base.js?v=70000" defer></script>
<script src="re-1.js?v=70000" defer></script>
<script src="re-2.js?v=70000" defer></script>
<script src="re-3.js?v=70000" defer></script>
<script src="re-4.js?v=70000" defer></script>
<script src="re-5.js?v=70000" defer></script>
<script src="render.js?v=70000" defer></script>
<script src="engine.js?v=70000" defer></script>
<script src="sound.js?v=70000" defer></script>
<script src="menu.js?v=70000" defer></script>
<script src="settings.js?v=70000" defer></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){ console.log('SW:', e); });
  });
}
</script>
</body>
</html>
