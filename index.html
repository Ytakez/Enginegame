<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ДВС — симулятор</title>
<link rel="icon" type="image/png" href="Icon.png">
<link rel="apple-touch-icon" href="Icon.png">
<link rel="shortcut icon" href="Icon.png">
<link rel="stylesheet" href="style.css?v=9999">
<style>
.gears-auto{display:none;gap:6px;background:#0d1319;border:1px solid #2a3a4c;border-radius:10px;padding:6px}
body.auto-mode .gears-auto{display:grid;grid-template-columns:repeat(3,1fr)}
body.auto-mode #gearsManual{display:none}
.agbtn{height:44px;border-radius:8px;border:1px solid #2c3e52;background:linear-gradient(180deg,#1a2430,#0e161e);color:#8ea4bd;font:700 16px/1 inherit;cursor:pointer;touch-action:manipulation}
.agbtn.on{background:linear-gradient(180deg,#2b7a56,#1c5a3d);border-color:#43c98a;color:#e6fff3}
.agbtn.neu.on{background:linear-gradient(180deg,#5a5f2b,#3d421c);border-color:#c9c943;color:#fbffe6}
.agbtn.rev.on{background:linear-gradient(180deg,#7a2b2b,#4a1a1a);border-color:#ff5b5b;color:#ffe6e6}
.ign-row{display:flex;align-items:center;gap:10px;width:100%}
.fuel-pump{width:18px;height:18px;border-radius:50%;background:#2a2a2a;border:2px solid #1a1a1a;flex:0 0 auto;box-shadow:inset 0 0 6px rgba(0,0,0,.8);transition:background .15s,box-shadow .15s}
.fuel-pump.off{background:#2a2a2a;border-color:#1a1a1a}
.fuel-pump.priming{background:#ff3030;border-color:#ff8080;animation:pulsePump .5s infinite alternate;box-shadow:0 0 14px rgba(255,60,60,.9),inset 0 0 6px rgba(255,255,255,.4)}
.fuel-pump.ready{background:#43c98a;border-color:#7bffb0;box-shadow:0 0 14px rgba(67,201,138,.9),inset 0 0 6px rgba(255,255,255,.4)}
.fuel-pump.shake{animation:shakePump .3s}
.fuel-pump-label{font-size:9px;color:#5d7189;letter-spacing:1px;font-weight:700;text-align:center;margin-top:2px}
@keyframes pulsePump{from{opacity:.55}to{opacity:1}}
@keyframes shakePump{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
</style>
</head>
<body>
<header>Двигатель внутреннего сгорания</header>
<div class="eng-badge" id="engBadge">R4</div>
<button id="repairBtn" type="button">🔧</button>
<main>
<div class="panel" id="engineWrap"><canvas id="engineCv" width="640" height="430"></canvas></div>
<div class="panel" id="dash">
<canvas id="gaugeCv" width="290" height="185"></canvas>
<div class="readouts">
<div class="ro"><div class="lbl">Скорость</div><div class="val" id="spdVal">0</div></div>
<div class="ro"><div class="lbl">Передача</div><div class="val amber" id="gearVal">N</div></div>
</div>
<div class="gears" id="gearsManual">
<button class="gbtn" data-g="1" type="button">1</button>
<button class="gbtn" data-g="3" type="button">3</button>
<button class="gbtn" data-g="5" type="button">5</button>
<button class="gbtn" data-g="2" type="button">2</button>
<button class="gbtn neu on gN" data-g="0" type="button">N</button>
<button class="gbtn" data-g="4" type="button">4</button>
<button class="gbtn rev" data-g="-1" type="button">R</button>
</div>
<div class="gears gears-auto" id="gearsAuto">
<button class="agbtn rev" data-ag="-1" type="button">R</button>
<button class="agbtn neu" data-ag="0" type="button">N</button>
<button class="agbtn on" data-ag="1" type="button">D</button>
</div>
<div class="ign-row">
<div class="fuel-pump off" id="fuelLight"></div>
<button class="ignbtn on" id="ignBtn" type="button">Зажигание</button>
</div>
<div class="fuel-pump-label">БЕНЗОНАСОС: <span id="fuelText">ВЫКЛ</span></div>
</div>
</main>
<div class="pedals">
<div class="pedal clutch" id="pClutch" data-pedal="clutch"><div class="bar"></div><span class="icon">🦶</span><span>СЦЕПЛЕНИЕ</span><span class="sub">держать</span></div>
<div class="pedal brake" id="pBrake" data-pedal="brake"><div class="bar"></div><span class="icon">🛑</span><span>ТОРМОЗ</span><span class="sub">держать</span></div>
<div class="pedal" id="pGas" data-pedal="gas"><div class="bar"></div><span class="icon">⛽</span><span>ГАЗ</span><span class="sub">держать</span></div>
</div>
<div id="breakBanner"></div>
<div id="err"></div>
<script src="physics.js?v=9999" defer></script>
<script src="render-base.js?v=9999" defer></script>
<script src="re-1.js?v=9999" defer></script>
<script src="re-2.js?v=9999" defer></script>
<script src="re-3.js?v=9999" defer></script>
<script src="re-4.js?v=9999" defer></script>
<script src="re-5.js?v=9999" defer></script>
<script src="render.js?v=9999" defer></script>
<script src="engine.js?v=9999" defer></script>
<script src="sound.js?v=9999" defer></script>
<script src="menu.js?v=9999" defer></script>
<script src="settings.js?v=9999" defer></script>
</body>
</html>
